services:
  pinshare:
    build:
      context: .
      dockerfile: Dockerfile
    image: pinshare-pinshare:latest
    container_name: pinshare
    # user: "${UID:-1000}:${GID:-1000}"  # Run as host user to avoid permission issues on volumes
    volumes:
      - ./data:/opt/pinshare/data
    ports:
      - "9090:9090"  # PinShare API (required for UI)
      - "8080:8080"  # IPFS Gateway (previews/content serving)
      # Optional IPFS ports (uncomment for telemetry/previews)
      - "5001:5001"  # IPFS API + Web UI (http://localhost:5001/webui)
      # Optional P2P ports for full network connectivity (add if needed)
      # - "4001:4001"
      # - "4001:4001/udp"
      - "50001:50001"  # libp2p
    environment:
      # Secrets
      - VT_TOKEN=${VT_TOKEN:-REDACTED}  # Set your VirusTotal token if using API path
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-http://localhost:9090/api/v1/google-drive/callback}
      - PS_ENCRYPTION_KEY=${PS_ENCRYPTION_KEY:-12345678901234567890123456789012}  # 32-byte key for token encryption
      - PS_ALLOWED_ORIGINS=${PS_ALLOWED_ORIGINS:-http://localhost:5174}  # CORS allowed origins

      # Organization settings
      - PS_ORGNAME=${PS_ORGNAME:-Cypherpunk}
      - PS_GROUPNAME=${PS_GROUPNAME:-TestLab}

      # Ports
      - PS_LIBP2P_PORT=${PS_LIBP2P_PORT:-50001}

      # Directories
      - PS_UPLOAD_FOLDER=${PS_UPLOAD_FOLDER:-./upload}
      - PS_CACHE_FOLDER=${PS_CACHE_FOLDER:-./cache}
      - PS_REJECT_FOLDER=${PS_REJECT_FOLDER:-./rejected}
      - PS_TEMP_DOWNLOAD_DIR=${PS_TEMP_DOWNLOAD_DIR:-./tmp/gdrive}

      # Files
      - PS_METADATA_FILE=${PS_METADATA_FILE:-metadata.json}
      - PS_IDENTITY_KEY_FILE=${PS_IDENTITY_KEY_FILE:-identity.key}
      - PS_DATABASE_FILE=${PS_DATABASE_FILE:-pinshare.db}

      # Feature flags
      - PS_FF_ARCHIVE_NODE=${PS_FF_ARCHIVE_NODE:-false}
      - PS_FF_CACHE=${PS_FF_CACHE:-true}
      - PS_FF_MOVE_UPLOAD=${PS_FF_MOVE_UPLOAD:-false}
      - PS_FF_SENDFILE_VT=${PS_FF_SENDFILE_VT:-false}
      - PS_FF_SKIP_VT=${PS_FF_SKIP_VT:-true}
      - PS_FF_IGNORE_UPLOADS_IN_METADATA=${PS_FF_IGNORE_UPLOADS_IN_METADATA:-false}

      # Google Drive import settings
      - PS_MAX_CONCURRENT_JOBS=${PS_MAX_CONCURRENT_JOBS:-3}
      - PS_MAX_FILE_SIZE_MB=${PS_MAX_FILE_SIZE_MB:-1024}
    deploy:
      resources:
        limits:
          memory: 2G  # Increased for ClamAV virus scanner
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]  # Add /health endpoint if needed, or use IPFS check
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true  # Ensure proper init for user/perms

  pinshare-ui:
    image: node:20-alpine
    container_name: pinshare-ui
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./pinshare-ui:/app
      - /app/node_modules  # Avoid overwriting node_modules with host
    ports:
      - "5174:5174"  # Vite dev server with hot reload
    depends_on:
      - pinshare
    environment:
      # Use absolute URLs to backend (http://localhost:9090 from browser perspective)
      - VITE_API_BASE=http://localhost:9090
      - VITE_GATEWAY_BASE=http://localhost:8080/ipfs
      - VITE_IPFS_API_BASE=http://localhost:5001/api/v0
      - VITE_OAUTH_BASE=http://localhost:8888
    restart: unless-stopped

  oauth-broker:
    build:
      context: ./oauth-broker
      dockerfile: Dockerfile
    container_name: pinshare-oauth-broker
    ports:
      - "8888:8888"  # OAuth Broker (http://localhost:8888)
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URL=http://localhost:8888/callback
      - PORT=8888
    restart: unless-stopped

networks:
  default:
    name: pinshare-network
