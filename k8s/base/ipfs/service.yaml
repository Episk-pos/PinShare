apiVersion: v1
kind: Service
metadata:
  name: ipfs
  namespace: pinshare
  labels:
    app: ipfs
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: ipfs
  ports:
  - name: api
    port: 5001
    targetPort: 5001
    protocol: TCP
  - name: gateway
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: swarm-tcp
    port: 4001
    targetPort: 4001
    protocol: TCP
  - name: swarm-udp
    port: 4001
    targetPort: 4001
    protocol: UDP
