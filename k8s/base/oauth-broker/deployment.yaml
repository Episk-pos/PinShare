apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-broker
  namespace: pinshare
  labels:
    app: oauth-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-broker
  template:
    metadata:
      labels:
        app: oauth-broker
    spec:
      containers:
        - name: oauth-broker
          image: ghcr.io/episk-pos/oauth-broker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP

          envFrom:
            - secretRef:
                name: oauth-broker-secret

          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
