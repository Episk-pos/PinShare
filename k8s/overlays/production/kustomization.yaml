apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pinshare

# Base resources
bases:
  - ../../base

# Production-specific secrets (SOPS-encrypted, decrypted by Flux)
# These contain production URLs (oauth.episkopos.community, etc.)
# Note: Flux will decrypt these automatically with SOPS
resources:
  - oauth-broker-secret.yaml
  - pinshare-backend-secret.yaml
